# There is deliberately no [sources] block here: ExTinyMD 0.3.0 IS in the
# General registry (verified by resolving `PackageSpec(name = "ExTinyMD",
# version = v"0.3")`; the v0.3.0 tag is the PR #13 merge, so it really does
# carry the Phase 1 + Phase 2 electrostatics stdlib and not the much older
# Project.toml that has read "0.3.0" since 2023), so the [compat] bound above
# is all that is needed. The one override this package still needs -- for
# QuasiEwald 0.3, whose own decoupling is unmerged -- is test-only and lives
# in test/Project.toml, together with its `QuasiEwald = "0.3"` [compat] bound:
# a [compat] entry here for a package listed in neither [deps], [weakdeps] nor
# [extras] is rejected outright by Pkg ("Compat `QuasiEwald` not listed in
# `deps`, `weakdeps` or `extras` section"), so with the dead [extras] pair gone
# the test-only bound has nowhere else to live.
#
# There is also deliberately no [extras]/[targets] pair. This package used to
# declare its test environment TWICE -- once as [extras]/[targets] here and
# once as test/Project.toml -- and Julia honours test/Project.toml whenever it
# is present, ignoring [extras]/[targets] entirely. The duplicate was therefore
# dead: a [compat] or [sources] edit made only here silently did nothing. The
# single surviving declaration is test/Project.toml, because that is the one
# Julia actually reads.
#
# ExTinyMD is still a hard [deps] entry at this commit. It becomes a
# [weakdeps]/[extensions] pair in the same change that moves the last
# ExTinyMD-coupled code out of src/ and into ext/SoEwald2DExTinyMDExt.jl --
# moving it early would only make the package unloadable in between.
